# Builds the Silica OS image from the latest silica-packages release, makes a qcow2 with
# bootc-image-builder and boots it under KVM (tools/boot-test.sh): the Silica session must come
# up on DRM/KMS with a non-black first frame. Screenshot and serial console are uploaded.
#
# Packages: the RPMs of the latest silica-packages release `v*` (a public repository: the
# workflow's own token reads it). Before the first packages release the image is built without
# them (SILICA_PACKAGES=none) to check the rest, and the boot test is skipped.
#
# silica-packages triggers this workflow after a release with a repository_dispatch of type
# `packages-release` and `client_payload.tag`.
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      packages_tag:
        description: silica-packages release tag (empty for the latest)
        required: false
  repository_dispatch:
    types: [packages-release]

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Silica packages
        id: packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag || inputs.packages_tag }}
        run: |
          tag="$TAG"
          if [ -z "$tag" ]; then
            # Package releases are `v*`; `engine-*` releases only carry the engine tarball.
            tag=$(gh release list -R silica-os/silica-packages --limit 50 \
              --json tagName --jq '[.[].tagName | select(startswith("v"))][0] // empty')
          fi
          if [ -z "$tag" ]; then
            echo "::notice::silica-packages has no release yet: building without the Silica packages, no boot test"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$tag" -R silica-os/silica-packages -p '*.rpm' -D rpms
          rm -f rpms/*.src.rpm rpms/*-debuginfo-* rpms/*-debugsource-*
          ls -la rpms
          echo "mode=required" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build the image without the Silica packages
        if: steps.packages.outputs.mode == 'none'
        run: tools/build-image.sh --no-packages --no-disk

      - name: Build the image and the boot-test disk
        if: steps.packages.outputs.mode == 'required'
        run: tools/build-image.sh --test --type qcow2

      - name: Enable KVM
        if: steps.packages.outputs.mode == 'required'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        if: steps.packages.outputs.mode == 'required'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils

      - name: Boot test
        if: steps.packages.outputs.mode == 'required'
        run: tools/boot-test.sh output/qcow2/disk.qcow2 --timeout 900

      - name: Upload the screenshot and the console
        if: always() && steps.packages.outputs.mode == 'required'
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-${{ steps.packages.outputs.tag }}
          path: |
            output/boot-test/screenshot.png
            output/boot-test/console.log
          if-no-files-found: ignore

      # A tag `v*` publishes the release: the bootable container image on ghcr.io (for
      # `bootc switch` from Fedora Atomic) and the qcow2 disk for virtual machines, both without
      # the boot-test layer. Only after the boot test passed.
      - name: Release disk
        if: startsWith(github.ref, 'refs/tags/v') && steps.packages.outputs.mode == 'required'
        run: |
          sudo rm -rf output/qcow2
          tools/build-image.sh --type qcow2
          sudo qemu-img convert -c -O qcow2 output/qcow2/disk.qcow2 "silica-os-${GITHUB_REF_NAME}.qcow2"
          sudo chown "$(id -u):$(id -g)" "silica-os-${GITHUB_REF_NAME}.qcow2"
          ls -la "silica-os-${GITHUB_REF_NAME}.qcow2"
          # GitHub release assets stop at 2 GiB: larger disks go up in parts.
          if [ "$(stat -c %s "silica-os-${GITHUB_REF_NAME}.qcow2")" -gt 2000000000 ]; then
            split -b 1900M -d "silica-os-${GITHUB_REF_NAME}.qcow2" "silica-os-${GITHUB_REF_NAME}.qcow2.part"
            rm "silica-os-${GITHUB_REF_NAME}.qcow2"
          fi
          sha256sum silica-os-"${GITHUB_REF_NAME}".qcow2* > SHA256SUMS

      - name: Release container image
        if: startsWith(github.ref, 'refs/tags/v') && steps.packages.outputs.mode == 'required'
        run: |
          image=ghcr.io/silica-os/silica-os
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman tag localhost/silica-os:latest "$image:${GITHUB_REF_NAME}" "$image:latest"
          sudo podman push "$image:${GITHUB_REF_NAME}"
          sudo podman push "$image:latest"

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && steps.packages.outputs.mode == 'required'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES_TAG: ${{ steps.packages.outputs.tag }}
        run: |
          gh release create "$GITHUB_REF_NAME" --prerelease \
            --title "Silica ${GITHUB_REF_NAME} (alpha)" \
            --notes-file <(sed -e "s/@TAG@/${GITHUB_REF_NAME}/g" -e "s/@PACKAGES@/${PACKAGES_TAG}/g" docs/release-notes.md) \
            silica-os-"${GITHUB_REF_NAME}".qcow2* SHA256SUMS output/boot-test/screenshot.png
